[package]
name = "portal2-sdk"
version = "1.1.0"
edition = "2024"
authors = ["LaVashikk <contact@lavashik.dev>"]
description = "A Rust SDK for Portal 2 modding and plugin development"
license = "MIT"
repository = "https://github.com/LaVashikk/portal2-rust-overlay/tree/main/crates/portal2-sdk"
readme = "README.md"
keywords = ["portal2", "source-engine", "sdk", "gamedev"]
categories = ["api-bindings", "game-development"]

# Portal 2 is a 32-bit game, and these bindings mirror its ABI: the `thiscall`
# convention only exists on x86 Windows targets. Left on the docs.rs default
# (x86_64-unknown-linux-gnu) the build fails outright, so pin it to the platform
# the crate is actually written against.
# Note: since 2026-05-01 docs.rs builds *only* the default target unless `targets`
# is listed explicitly.
[package.metadata.docs.rs]
default-target = "i686-pc-windows-msvc"
targets = ["i686-pc-windows-msvc"]

[dependencies]
log = "0.4"
bitflags = "2.5.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "=0.59"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D9",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Memory",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_System_ProcessStatus",
]
